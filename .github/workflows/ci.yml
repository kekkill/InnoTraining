name: build-and-test
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet restore InnoShop.slnx --locked-mode
      - run: dotnet build InnoShop.slnx -c Release --no-restore
      - run: dotnet test InnoShop.slnx -c Release --no-build
